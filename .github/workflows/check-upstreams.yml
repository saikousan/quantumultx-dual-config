name: Check QX upstream modules

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Sync QX resource parser
        run: curl --fail --silent --show-error --location https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js -o resource-parser.js
      - name: Check public modules
        run: python scripts/check_upstreams.py
      - name: Commit status report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource-parser.js UPSTREAM_STATUS.md
          git diff --cached --quiet || git commit -m "Update upstream module status"
          git push
