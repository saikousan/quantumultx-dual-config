# Quantumult X Apple TV 旁路由模板（公开安全版）
# 不包含任何私人订阅或节点凭据

[general]
server_check_url=http://www.gstatic.com/generate_204
server_check_timeout=3000
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
excluded_routes=10.10.10.0/24, 239.255.255.250/32
fallback_udp_policy=direct

[dns]
# 不启用 no-ipv6/no-system，保留系统的 IPv4/IPv6 解析能力
server=223.5.5.5
server=119.29.29.29
server=114.114.114.114

[server_local]
# 仅在私有版本中填写自建节点
# vless=example.com:443, method=none, password=CHANGE_ME, tag=自建节点

[server_remote]
# 仅在私有版本中填写机场订阅；公开仓库不要取消注释
# https://example.com/private-subscription, tag=机场一, update-interval=86400, opt-parser=true, enabled=true

[policy]
static=节点选择, 自动选择, 远程连接, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
static=远程连接, 自动选择, direct, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png
static=AI服务, 美国优选, 远程连接, direct, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/AI.png
url-latency-benchmark=自动选择, server-tag-regex=.*, check-interval=900, tolerance=50, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
url-latency-benchmark=美国优选, server-tag-regex=(?i)(美国|US|United States|USA), check-interval=900, tolerance=80, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png

[filter_remote]
https://raw.githubusercontent.com/ddgksf2013/Filter/master/Unbreak.list, tag=规则修正, force-policy=direct, update-interval=604800, opt-parser=true, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Apple/Apple.list, tag=苹果服务, force-policy=direct, update-interval=604800, opt-parser=true, enabled=true
https://raw.githubusercontent.com/VirgilClyne/GetSomeFries/main/ruleset/ASN.China.list, tag=中国大陆, force-policy=direct, update-interval=604800, opt-parser=true, enabled=true
https://ddgksf2013.top/filter/Ai.yaml, tag=AI服务, force-policy=AI服务, update-interval=604800, opt-parser=true, enabled=true

[filter_local]
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 224.0.0.0/4, direct
host, infuse.tv, direct
host-suffix, infuse.tv, direct
host-suffix, cheers.com, direct
host, 8.135.238.135, 远程连接
host-suffix, cg123.fun, 远程连接
host-suffix, deackseed.top, 远程连接
geoip, cn, direct
final, 节点选择

[rewrite_local]

[rewrite_remote]

[task_local]

[mitm]
# Apple TV 旁路由模板不启用 MITM
